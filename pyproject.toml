[project]
name = "pht-food-bot"
version = "0.1.0"
description = "Telegram bot that logs photographed food to FatSecret, which Physical Life syncs from"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=21",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: modules live at the repo root rather than in a package directory.
only-include = ["main.py", "bot.py", "vision.py", "fatsecret.py", "store.py"]
sources = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
    "ANN",      # require annotations
    "ASYNC",    # async correctness — catches blocking calls in async defs
    "D",        # docstrings
]
ignore = [
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    "D104",     # package docstrings — flat layout has no packages
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Third-party stubs are patchy; keep strictness on our own code without drowning in library noise.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
